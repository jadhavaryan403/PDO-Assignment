<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Magic - Python & Flask App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white shadow-xl rounded-2xl p-8 max-w-lg w-full">
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-2 text-center">String Magic</h1>
        <p class="text-gray-500 text-center mb-6">A simple Python string manipulation tool with a web interface.</p>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Enter your text:</label>
                <textarea name="text" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Type something here...">{{ original_text }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Select Operation:</label>
                <select name="operation" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="uppercase" {% if operation == 'uppercase' %}selected{% endif %}>Convert to Uppercase</option>
                    <option value="lowercase" {% if operation == 'lowercase' %}selected{% endif %}>Convert to Lowercase</option>
                    <option value="reverse" {% if operation == 'reverse' %}selected{% endif %}>Reverse String</option>
                    <option value="count" {% if operation == 'count' %}selected{% endif %}>Character & Word Count</option>
                    <option value="palindrome" {% if operation == 'palindrome' %}selected{% endif %}>Check Palindrome</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 transition duration-200 shadow-md">
                Transform String
            </button>
        </form>

        {% if result is not none %}
        <div class="mt-6 p-4 bg-indigo-50 border border-indigo-200 rounded-lg">
            <h2 class="text-sm font-semibold text-indigo-800 uppercase tracking-wide mb-1">Result:</h2>
            <p class="text-gray-800 font-medium break-words">{{ result }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
